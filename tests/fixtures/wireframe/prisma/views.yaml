views:
  - name: profile_dashboard
    kind: dashboard
    route: /views/profiles
    root: Profile
    aggregates:
      - {name: metric_count, of: Metric, fk: profileId}
    signal: "metric_count >= 1"

# First-run orientation dogfood (onboarding: archetype — harness for FR-ONB).
onboarding:
  route: /welcome
  title: Welcome
  nav_label: Welcome
  redirect_root_if_empty: true
  lead: Wireframe fixture orientation — skip anytime.
  continue_href: /ui/profile
  help_href: /about
  tips:
    - Add a Profile first
    - Metrics hang off a Profile
  empty_states:
    Profile: Add your first profile to get started.
    Note: Capture a note when you are ready.
